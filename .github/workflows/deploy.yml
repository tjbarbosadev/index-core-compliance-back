name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-opcore-api
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci
        env:
          HUSKY: '0'
          DATABASE_URL: postgresql://opcore:opcore@127.0.0.1:5432/opcore

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck
        env:
          DATABASE_URL: postgresql://opcore:opcore@127.0.0.1:5432/opcore

      - name: Test
        run: npm run test
        env:
          DATABASE_URL: postgresql://opcore:opcore@127.0.0.1:5432/opcore

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://opcore:opcore@127.0.0.1:5432/opcore

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          test -n "$SSH_KEY" || { echo "Missing secret DEPLOY_SSH_KEY"; exit 1; }
          test -n "$SSH_HOST" || { echo "Missing secret DEPLOY_HOST"; exit 1; }
          test -n "$SSH_USER" || { echo "Missing secret DEPLOY_USER"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy on dl3809
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        run: |
          PORT="${SSH_PORT:-22}"
          REMOTE_DIR="${DEPLOY_DIR:-~/projects/opcore/api}"
          ssh -tt -i ~/.ssh/deploy_key -p "$PORT" "$SSH_USER@$SSH_HOST" \
            "cd ${REMOTE_DIR} && git fetch origin && git reset --hard origin/main && bash scripts/deploy.sh"
